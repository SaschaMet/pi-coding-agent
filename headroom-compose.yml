# Headroom compression proxy for the @raquezha/noheadroom PI extension.
#
# The extension (see Headroom-Readme.md) sends PI tool-output text to this proxy's
# /v1/compress endpoint, gets a compressed version back, and substitutes it into the
# conversation before PI sends it to whatever model/provider you use. The proxy itself
# does NOT call an LLM and needs no provider API key — it runs Headroom's token-mode
# compression locally.
#
#   docker compose -f headroom-compose.yml up -d
#   docker compose -f headroom-compose.yml logs -f
#   docker compose -f headroom-compose.yml down
#
# Then in PI: /headroom health  (should report online at http://127.0.0.1:8788)
#
# Notes:
# - HEADROOM_HOST=0.0.0.0 is REQUIRED so the published port reaches the proxy.
# - One proxy serves ALL providers (it compresses message content, not provider calls),
#   so OAuth subscriptions (github-copilot, openai-codex) are covered too.
# - Set the extension's autoStart=false when using Docker (it manages this container, not pip).
#   CRITICAL: the noheadroom extension's autoStart DEFAULTS TO true — if /health fails while
#   this container is down, it spawns a NATIVE `headroom proxy` on 8788 (detached, orphaned to
#   launchd, survives across sessions) that then blocks this container's port forever
#   ("address already in use") and silently serves sessions on headroom's default settings
#   (dedup ON, no --lossless). Prevent it BEFORE the first PI session:
#     mkdir -p ~/.pi/agent/headroom && printf '{\n  "autoStart": false\n}\n' > ~/.pi/agent/headroom/settings.json
#   Full writeup + detection commands: noheadroom.README.md section 4 (duplicate native proxy)
#   and section 5 (running a native proxy with the same features instead of Docker).
# - Container listens on 8787 (the image default) internally; only the host-side publish
#   is remapped to 8788. Do NOT set HEADROOM_PORT to change the internal bind port — the
#   image's baked-in HEALTHCHECK hardcodes `curl http://127.0.0.1:8787/readyz`, so bumping
#   the internal port makes the healthcheck fail (curl exit 7) forever while the proxy
#   itself works fine. This was live for 5+ days before being caught (Docker showed
#   "unhealthy", `/health` still answered from the host since the port PUBLISH was correct).

services:
  headroom:
    # Pinned to a tagged release. This was previously :main, tracked deliberately to get
    # HEADROOM_COMPRESS_ALLOW_REMOTE (merged 2026-07-21, commit 1329ed7, PR #2458), which
    # wasn't in any tagged release then (confirmed absent from v0.32.0). That feature has
    # since shipped in tagged releases — verified present at v0.37.0 (headroom/proxy/server.py),
    # so per the note above we re-pin to a tag instead of tracking the moving :main branch.
    # Re-verified against v0.37.0 (2026-08-27) that the command/entrypoint/env assumptions
    # below still hold: entrypoint `headroom proxy`, baked-in HEALTHCHECK on 8787/readyz,
    # nonroot /home/nonroot/.headroom volume, and every env var + CLI flag still exists.
    # NOTE: v0.37.0 made /v1/compress session-aware (sidecar mode) + added a /v1/usage relay
    # — confirm the noheadroom extension round-trip still works after this bump.
    # Docker tag drops the `v` that the GitHub release tag carries: release v0.37.0 == image 0.37.0.
    image: ghcr.io/headroomlabs-ai/headroom:0.37.0
    container_name: headroom
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 only: HEADROOM_COMPRESS_ALLOW_REMOTE below relaxes /v1/compress's
      # loopback check (necessary because host->container traffic through Docker's port
      # publishing arrives as a non-loopback source IP, not 127.0.0.1, as seen by the app
      # inside the container). Without this explicit bind, compose publishes on ALL host
      # interfaces by default, which combined with ALLOW_REMOTE would expose /v1/compress
      # to the whole LAN, not just this machine.
      - "127.0.0.1:8788:8787"
    volumes:
      # Read-only transcript mounts so `headroom audit-reads` / `inspect` can size real
      # compression opportunities and diagnose corruption from actual session history,
      # instead of guessing at defaults. Container resolves its own $HOME as /root (confirmed
      # via `headroom audit-reads` erroring "/root/.claude/projects does not exist" before
      # this mount existed), so both are mounted under /root to match audit-reads' default
      # path resolution. Claude Code transcripts + pi coding-agent transcripts (jsonl
      # sessions under ~/.pi/agent/sessions) — both route through this same proxy.
      - "${HOME}/.claude/projects:/root/.claude/projects:ro"
      - "${HOME}/.pi/agent/sessions:/root/.pi/agent/sessions:ro"
    environment:
      HEADROOM_HOST: "0.0.0.0"
      HEADROOM_TELEMETRY: "off"
      # Cross-turn (whole-conversation) verbatim de-dup: OFF.
      # Headroom's DEFAULT "coding" savings profile (agent_savings.py, DEFAULT_PROFILE)
      # seeds HEADROOM_DEDUPE=1 into the proxy process env via setdefault
      # (seed_proxy_env_defaults), which makes ContentRouter fold any tool output that
      # repeats >=3 lines / >=40 chars of an earlier tool output (verbatim or uniformly
      # renumbered) into a one-line pointer like "[↑47L same as msg 16: '...']"
      # (transforms/cross_turn_dedup.py). That is lossy for the agent's working memory:
      # re-running a query after an environment change returns the pointer instead of
      # the data, which forced marker/file workarounds and extra agent round-trips
      # (observed in the shopware QA session 2026-08-20). Explicit env wins over the
      # profile's setdefault seeding, so this overrides the coding profile without
      # changing any of its other knobs (lossless folds, protect_reads, ...). Gate:
      # content_router.py _cross_turn_dedup_enabled = config flag OR HEADROOM_DEDUPE in
      # (1,true,yes,on) — "0" is off. Re-enable by deleting this line.
      HEADROOM_DEDUPE: "0"
      # /v1/compress is loopback-gated by default (server.py, issue #1537) — the app sees
      # requests arriving through Docker's port-forwarding as non-loopback and 404s them.
      # HEADROOM_COMPRESS_ALLOW_REMOTE is the documented, scoped opt-out for exactly this
      # (drops ONLY /v1/compress's loopback dependency; HEADROOM_PROXY_TOKEN auth and every
      # other admin/debug/settings/CCR route's loopback gate are unaffected). Do NOT "fix"
      # this by patching loopback_guard.py instead — that disables the peer-IP check for
      # every loopback-gated route in the proxy (admin/runtime-env, settings write, CCR
      # retrieve, etc.), not just this one, and silently stops working on the next bump.
      #
      # Live as of v0.37.0 (and :main since 2026-07-21) — was a no-op under the previous
      # :latest pin (v0.32.0), which predates this feature. Note the CCR retrieve family
      # (/v1/retrieve*) has NO such override, ever, by design — that gap can't be fixed by
      # env var regardless of version, :main included.
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      # CCR's Context Tracker otherwise auto-reinjects full original content back into
      # the message stream (relevance-scored, default ON, up to 2x/query) with NO explicit
      # retrieve call and no reliable marker distinguishing replayed history from a live
      # instruction. v0.23.0's changelog ("scope proactive expansion by workspace")
      # confirms this class of bug already leaked stale content across projects once.
      # Verified via `docker exec headroom headroom proxy --help`: this env var is real
      # (flag equivalent --no-ccr-proactive-expansion also exists, same effect — env
      # var chosen for consistency with the rest of this block). Disabling it keeps CCR
      # retrieval available only via the explicit, agent-initiated headroom_retrieve MCP
      # tool call — never auto-injected. See noheadroom.README.md section 3.
      HEADROOM_NO_CCR_PROACTIVE_EXPANSION: "1"
    # The extension calls /v1/compress, so the proxy runs in token-compression mode.
    # Verified against :latest (image 0.32.0): entrypoint is `headroom proxy`, so these
    # flags append to form `headroom proxy --mode token --no-cache`. If a future image
    # uses a bare `headroom` entrypoint, prepend "proxy": ["proxy","--mode","token","--no-cache"].
    #
    # Image moved orgs: the repo transferred from chopratejas/headroom to headroomlabs-ai/headroom
    # on 2026-06-29 (after v0.28.0). GHCR did not redirect the old package, so
    # ghcr.io/chopratejas/headroom:latest is frozen at v0.27.0 forever — do not revert this.
    # --lossless: format-native lossless compaction for tool outputs (dedup identical/subset
    #   reads, strip line-number scaffolding, collapse stale post-edit reads) instead of the
    #   lossy token-mode rewriting that was silently dropping keywords (if/set/endif/and/=)
    #   from Twig file reads in the shopware repo. Chosen over a blanket
    #   --protect-tool-results Read after `headroom audit-reads` on 717 real sessions showed
    #   Read is 47.4% of all tool-output bytes, and ~37% of that is safely-compressible
    #   duplicate/scaffolding (stale-after-edit 20.6%, line-number scaffolding 7.5%, identical
    #   repeat 5.8%, subset containment 3.4%) rather than genuine prose/code content — blanket
    #   protection gave up that whole slice of legitimate savings, not just the risky part.
    #   No CCR retrieval marker is emitted in this mode, so no MCP retrieve tool is needed.
    # --log-file / --log-messages: persist pre/post-compression snapshots so `headroom inspect`
    #   can show real before/after diffs, and `headroom perf` can analyze real traffic. Path is
    #   inside the image's existing /home/nonroot/.headroom volume so it survives container
    #   recreation. --log-messages may log sensitive request/response content to this file —
    #   acceptable here since it's a local-only bind mount, not shipped anywhere.
    command: ["--mode", "token", "--no-cache", "--lossless", "--log-file", "/home/nonroot/.headroom/proxy.log", "--log-messages"]
